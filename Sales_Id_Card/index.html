    <style>
        body {
            /* Latar belakang dari Pinterest */
            background-color: #0f172a; 
            background-image: url("https://i.pinimg.com/736x/23/f5/c8/23f5c8461c99a681bb4355c92d6db5a4.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
        }

        /* Gradient overlay gelap agar teks dan kartu tetap fokus (vignette effect) */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(11, 17, 32, 0.4) 0%, rgba(11, 17, 32, 0.9) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* 3D Container & Card */
        .perspective-container {
            perspective: 2000px;
        }

        .business-card {
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            box-shadow: 
                20px 20px 60px rgba(0, 0, 0, 0.15),
                -10px -10px 40px rgba(255, 255, 255, 0.8),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        /* Subtle noise texture for physical card feel */
        .card-texture {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            border-radius: inherit;
            pointer-events: none;
            z-index: 1;
        }

        /* Glare effect (Spot UV simulation) */
        .card-glare {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.15) 25%, transparent 30%);
            border-radius: inherit;
            pointer-events: none;
            z-index: 10;
            transform: translateZ(2px);
            background-size: 200% 200%;
            background-position: 100% 0;
        }

        /* Batik Motif inside the card */
        .card-batik {
            position: absolute;
            inset: 0;
            /* Motif Batik Kawung SVG */
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0C13.431 0 0 13.431 0 30c0 16.569 13.431 30 30 30 16.569 0 30-13.431 30-30C60 13.431 46.569 0 30 0zm0 57.5C14.812 57.5 2.5 45.188 2.5 30 2.5 14.812 14.812 2.5 30 2.5c15.188 0 27.5 12.312 27.5 27.5 0 15.188-12.312 27.5-27.5 27.5z' fill='%23ffffff' fill-opacity='0.03' fill-rule='evenodd'/%3E%3Cpath d='M30 15c-8.284 0-15 6.716-15 15s6.716 15 15 15 15-6.716 15-15-6.716-15-15-15zm0 27.5c-6.903 0-12.5-5.597-12.5-12.5S23.097 17.5 30 17.5s12.5 5.597 12.5 12.5-5.597 12.5-12.5 12.5z' fill='%23ffffff' fill-opacity='0.03' fill-rule='evenodd'/%3E%3Cpath d='M30 22.5c-4.142 0-7.5 3.358-7.5 7.5s3.358 7.5 7.5 7.5 7.5-3.358 7.5-7.5-3.358-7.5-7.5-7.5zm0 12.5c-2.761 0-5-2.239-5-5s2.239-5 5-5 5 2.239 5 5-2.239 5-5 5z' fill='%23ffffff' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            opacity: 0.8;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* Z-Index layering for 3D Pop */
        .layer-1 { transform: translateZ(20px); }
        .layer-2 { transform: translateZ(40px); }
        .layer-3 { transform: translateZ(60px); }

        /* Smooth reset */
        .reset-transition {
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 0px; }

        /* Toast Notification */
        #toast-notification {
            position: fixed;
            bottom: 2.5rem; /* 40px */
            left: 50%;
            transform: translateX(-50%) translateY(100%); /* Start off-screen */
            background-color: #1E293B; /* slate-800 */
            color: white;
            padding: 0.75rem 1.5rem; /* py-3 px-6 */
            border-radius: 0.5rem; /* rounded-lg */
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }
        #toast-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        #toast-notification.error {
            background-color: #991B1B; /* red-800 */
        }
    </style>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Icons
            lucide.createIcons();

            // --- Cache DOM Elements ---
            const card = document.getElementById('card');
            const toast = document.getElementById('toast-notification');
            const shareButton = document.getElementById('share-btn');
            const downloadVCFButton = document.getElementById('download-vcf-btn');

            if (!card || !toast || !shareButton || !downloadVCFButton) {
                console.error("One or more essential elements are missing from the DOM.");
                return;
            }

            // --- Constants ---
            const SHARE_DEFAULTS = {
                url: 'https://kagum-hotel.com/card/christina-rhidsy-m/',
                title: 'Christina Rhidsy M - Digital Card',
                text: 'Lihat kartu nama digital Christina Rhidsy M, Corp. GM Sales & Marketing di KAGUM Hotels.'
            };

            const VCF_DATA = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'N:M;Christina;Rhidsy;;',
                'FN:Christina Rhidsy M',
                'ORG:KAGUM Hotels',
                'TITLE:Corp. GM Sales & Marketing',
                'TEL;TYPE=CELL,VOICE;PREF=1:+628192650116',
                'EMAIL:gm.sales@kagum-hotel.com',
                'URL:https://kagum-hotel.com',
                'END:VCARD'
            ].join('\n');

            // --- State ---
            let toastTimeout;
            let latestEvent = null;
            let isTicking = false;

            // --- 3D Card Effect ---
            const updateCardTransform = () => {
                if (!latestEvent) return;

                const rect = card.getBoundingClientRect();
                const clientX = latestEvent.type.startsWith('touch') ? latestEvent.touches[0].clientX : latestEvent.clientX;
                const clientY = latestEvent.type.startsWith('touch') ? latestEvent.touches[0].clientY : latestEvent.clientY;

                const x = clientX - rect.left;
                const y = clientY - rect.top;

                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -10;
                const rotateY = ((x - centerX) / centerX) * 10;

                card.style.transform = `perspective(2000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            };

            const handleCardMove = (e) => {
                if (e.type === 'touchmove') e.preventDefault();
                
                latestEvent = e;
                if (!isTicking) {
                    window.requestAnimationFrame(() => {
                        updateCardTransform();
                        isTicking = false;
                    });
                    isTicking = true;
                }
            };

            const handleCardLeave = () => {
                card.classList.add('reset-transition');
                card.style.transform = `perspective(2000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                
                setTimeout(() => {
                    card.classList.remove('reset-transition');
                }, 600);
            };

            const handleCardEnter = () => {
                card.classList.remove('reset-transition');
                isTicking = false;
            };

            // --- Toast Notification ---
            const showToast = (message, type = 'success') => {
                clearTimeout(toastTimeout);
                toast.textContent = message;
                toast.classList.remove('show', 'error');

                if (type === 'error') {
                    toast.classList.add('error');
                }
                toast.classList.add('show');

                toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
            };

            // --- Share Functionality ---
            const shareCard = async () => {
                if (!navigator.share) {
                    try {
                        await navigator.clipboard.writeText(SHARE_DEFAULTS.url);
                        showToast(`Link kartu nama telah disalin!`);
                    } catch (err) {
                        console.error('Could not copy text: ', err);
                        showToast('Gagal menyalin link.', 'error');
                    }
                    return;
                }

                try {
                    const originalTransform = card.style.transform;
                    card.style.transition = 'none';
                    card.style.transform = 'none';
                    
                    await new Promise(resolve => requestAnimationFrame(resolve));

                    const canvas = await html2canvas(card, {
                        useCORS: true,
                        backgroundColor: null,
                        scale: window.devicePixelRatio || 2,
                    });

                    card.style.transform = originalTransform;
                    card.style.transition = '';

                    canvas.toBlob(async (blob) => {
                        if (!blob) throw new Error("Failed to convert canvas to blob");
                        
                        const file = new File([blob], 'Christina_Rhidsy_M_Card.png', { type: 'image/png' });
                        const shareData = { ...SHARE_DEFAULTS, files: [file] };

                        if (navigator.canShare && navigator.canShare(shareData)) {
                            await navigator.share(shareData);
                        } else {
                            await navigator.share(SHARE_DEFAULTS);
                        }
                    }, 'image/png');

                } catch (err) {
                    console.error('Failed to capture or share image:', err);
                    await navigator.share(SHARE_DEFAULTS);
                }
            };

            // --- VCF Download ---
            const downloadVCF = () => {
                const blob = new Blob([VCF_DATA], { type: 'text/vcard;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'Christina_Rhidsy_M.vcf';
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // --- Attach Event Listeners ---
            card.addEventListener('mousemove', handleCardMove);
            card.addEventListener('mouseleave', handleCardLeave);
            card.addEventListener('mouseenter', handleCardEnter);
            card.addEventListener('touchmove', handleCardMove, { passive: false });
            card.addEventListener('touchend', handleCardLeave);
            card.addEventListener('touchcancel', handleCardLeave);
            card.addEventListener('touchstart', handleCardEnter);

            shareButton.addEventListener('click', shareCard);
            downloadVCFButton.addEventListener('click', downloadVCF);
        });
    </script>
